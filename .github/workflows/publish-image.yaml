name: Publish standalone web image

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find branches containing the tagged commit
        id: branches
        shell: bash
        run: |
          set -euo pipefail
          # Tags have no source branch; include every remote branch containing this commit.
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          {
            echo 'tags<<BRANCH_TAGS'
            while IFS= read -r branch; do
              branch="${branch#refs/remotes/origin/}"
              [[ "$branch" == 'HEAD' ]] && continue
              # Docker tags cannot contain slashes or start with a dot or hyphen.
              branch=$(printf '%s' "$branch" | sed 's/[^a-zA-Z0-9_.-]/-/g; s/^[.-]/_/')
              printf 'type=raw,value=%s\n' "${branch:0:128}"
            done < <(git for-each-ref --contains HEAD --format='%(refname)' refs/remotes/origin/)
            echo 'BRANCH_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            ${{ steps.branches.outputs.tags }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./line_oa/app
          file: ./line_oa/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

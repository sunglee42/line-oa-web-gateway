name: Publish prebuilt Add-on image
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the tested source image to this repository's GHCR package
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: inputs.confirm_publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: line_oa/app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: line_oa/app
      - run: npm test
        working-directory: line_oa/app
      - run: python3 scripts/check-backup-policy.py
      - run: python3 scripts/check-publication.py
      - name: Build and test the exact release image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./line_oa/app/package.json').version")"
          image="ghcr.io/${REPOSITORY,,}:${release_version}"
          docker build --platform linux/amd64 --build-arg "BUILD_VERSION=${release_version}" --build-arg BUILD_ARCH=amd64 --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t line-oa:test -t "${image}" line_oa
          python3 scripts/container-smoke.py
          echo "RELEASE_IMAGE=${image}" >> "$GITHUB_ENV"
      - name: Publish tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/line-oa-publish-docker"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$RELEASE_IMAGE"
          echo "Published $RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Before enabling image in the Add-on config, make the package public and verify anonymous download. Keep every published version required by retained backups.' >> "$GITHUB_STEP_SUMMARY"

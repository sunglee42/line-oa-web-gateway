name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: line_oa/app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: line_oa/app
      - run: npm test
        working-directory: line_oa/app
      - run: python3 scripts/check-backup-policy.py
      - run: python3 scripts/check-publication.py
      - run: docker build --platform linux/amd64 -t line-oa:test line_oa
      - run: python3 scripts/container-smoke.py

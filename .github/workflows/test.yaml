name: Build and smoke test standalone web gateway

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build standalone image
        run: docker build --tag line-oa-web:test ./line_oa/app

      - name: Verify the health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name line-oa-web-smoke --publish 8787:8787 line-oa-web:test
          trap 'docker stop line-oa-web-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs line-oa-web-smoke
          exit 1

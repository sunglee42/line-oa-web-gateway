name: LINE OA
version: "0.1.8"
slug: line_oa
url: https://github.com/xangin/line-oa-ha-addon
image: ghcr.io/xangin/line-oa-ha-addon
description: LINE OA Gateway with Ingress and secure Home Assistant pairing
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: stable
init: false
timeout: 30
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:message-text
panel_title: LINE OA
panel_admin: true
discovery:
  - line_oa
hassio_api: false
homeassistant_api: false
host_network: false
apparmor: true
backup: cold
backup_exclude:
  - tmp
  - tmp/*
  - cache
  - cache/*
  - .cache
  - .cache/*
  - logs
  - logs/*
  - "*.log"
options: {}
schema: {}
watchdog: http://[HOST]:8787/api/v1/health
